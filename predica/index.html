<script>
  (function(){
    const params = new URLSearchParams(window.location.search);

    const ref =
      params.get("ref") ||
      params.get("id") ||
      params.get("predica") ||
      params.get("p") ||
      "";

    const path = window.location.pathname;

    // /VidaAbundante/predica/  =>  /VidaAbundante
    const base = path.replace(/\/predica\/?$/i, "");

    const destino = ref
      ? `${window.location.origin}${base}/index.html?predicaRef=${encodeURIComponent(ref)}`
      : `${window.location.origin}${base}/index.html`;

    window.location.replace(destino);
  })();
</script>
