<!DOCTYPE html>
<html lang="es">
<head>
<!-- ================= CONFIGURACIÓN BÁSICA ================= -->
  <meta charset="UTF-8" />
  <title>Vida Abundante</title>
<!-- Escalado correcto en celulares 📱 -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
 
 <!-- ================= FUENTES DE GOOGLE ================= -->
  <!-- Se cargan todas las fuentes que luego podés usar en textos e imágenes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Lobster&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;700&family=Poppins:wght@400;700&family=Abril+Fatface&family=Cormorant:wght@400;700&family=Josefin+Sans:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<!-- ================= ICONOS ================= -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

 <!-- ================= html2canvas ================= -->
  <!-- Librería que convierte HTML en imagen (para generar imágenes bíblicas) -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    
 /* ================= ESTILOS GENERALES ================= */
    /* Estilo base para toda la página */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      background: #fff;
      color: #000;
    }

     /* Modo oscuro: cambia fondo y texto */
    body.oscuro {
      background: #121212;
      color: #e0e0e0;
    }
    
/* ================= HEADER SUPERIOR ================= */
/* Barra superior con botones de navegación */
#header {
  position: static; /* ✅ NO sticky */
  z-index: auto;
  background: #ffffff;
  border-bottom: 1px solid #ddd;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
    
/* Cambios para modo oscuro en header */
body.oscuro #header {
  background: #121212;
  border-color: #333;
}   
    
/* Contenedor de botones del menú (flex horizontal)*/
    #menu {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
    }
    
/* Estilo para los botones de navegación */
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      background: #eaeaea;
    }

    /* Estilo para los botones de navegación MODO OSCURO*/
    body.oscuro .nav-btn {
      background: #2a2a2a;
      color: #fff;
    }

  /* En móvil se oculta el texto y queda solo el emoji */
    @media (max-width: 640px) {
      .nav-btn .text {
        display: none;
      }
    }

  /* ================= SECCIONES GENERALES ================= */
    .seccion {
      padding: 15px;
    }

  /* ================= SECCIÓN BIBLIA ================= */
     /* Filtros para seleccionar libro y capítulo */
    .filtros {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

     /* Estilo select de filtros */
    .filtros select {
      padding: 10px;
      font-size: 16px;
    }

  /* Título del libro + capítulo */
    #titulo {
      margin: 12px 0;
      font-weight: bold;
    }
    
 /* Versículos */
    .versiculo {
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: background .2s;
  color: #000;
}

body.oscuro .versiculo {
  color: #fff;
}

/* Versículo marcado (resaltado) */
.versiculo[data-marcado="true"] {
  color: #000; 
}

body.oscuro .versiculo[data-marcado="true"] {
  color: #000; /* fuerza negro sobre color resaltador pastel */
}

/* Versículo seleccionado para imagen */
.versiculo.imagen {
  background: #4f6fa8 !important;
  color: #fff !important;
}

/* Número del versículo */
    .num {
      font-weight: bold;
      margin-right: 4px;
    }

    /* ================= PANEL ================= */
    .panel-tabs button {
      margin-right: 6px;
    }

    .panel-seccion {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #f5f5f5;
    }

    body.oscuro .panel-seccion {
      background: #1e1e1e;
    }

    textarea {
      width: 100%;
      height: 80px;
      border-radius: 10px;
      padding: 10px;
    }

    .grid-imagenes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .card-imagen {
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      background: #fff;
    }

    body.oscuro .card-imagen {
      background: #1e1e1e;
    }

    .card-imagen img {
      width: 100%;
      display: block;
    }

    .card-imagen .nombre {
      padding: 6px;
      font-size: 13px;
      text-align: center;
      font-weight: bold;
    }

/* ================= BARRA DE ACCIONES ================= */
.barra-acciones {
  position: sticky;
  bottom: 0;
  z-index: 20;

  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;

  padding: 8px;
  background: #f5f5f5;
  border-top: 1px solid #ddd;
}

body.oscuro .barra-acciones {
  background: #1e1e1e;
  border-color: #333;
}

.barra-acciones button {
  border-radius: 999px;
  padding: 6px 10px;
  border: none;
  cursor: pointer;
}

 /* Botón activo */
.barra-acciones button.activo {
  background: #ffe8c8;
  color: #000;
}

/* 🎨 Botón de color activo */
.color-btn.activo {
  outline: 3px solid #ffe8c8;
  transform: scale(1.15);
}

/* ================= MODO IMAGEN ================= */
    /* Cuando está activo el modo imagen */
.modo-imagen #accionesBiblia .accion-normal {
  display: none;
}

.modo-imagen #btnImagen {
  display: inline-block;
  background: #4f6fa8;
  color: #fff;
}

.modo-imagen #btnCrearImagen {
  display: inline-block;
}

.modo-imagen #header {
  box-shadow: 0 4px 12px rgba(79,111,168,0.4);
}

    
#seccion-biblia {
  padding-bottom: 90px;
}

 /* Crear Imagen OCULTO por defecto */
#btnCrearImagen {
  display: none;
}

/* Visible SOLO en modo imagen */
.modo-imagen #btnCrearImagen {
  display: inline-block;
}

 /* ================= PREVIEW IMAGEN ================= */
#previewImagen {
  position: relative;
  width: 100%;
  max-width: 420px;
  margin: 0 auto;

  aspect-ratio: 1 / 1;   /* 🔲 default */
  border-radius: 18px;
  overflow: hidden;

  background-size: cover;
  background-position: center;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background-color: rgba(0, 0, 0, 0.7);
  color: white;
  padding: 10px 20px;
  border-radius: 5px;
  font-size: 16px;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.toast[style="display: block;"] {
  opacity: 1;
}

/* 📐 FORMATOS */
#previewImagen.preview-post {
  height: 420px;
}

#previewImagen.preview-story {
  aspect-ratio: 9 / 16;
  max-height: 50vh;        /* 🔥 CLAVE */
}
   
/* ================= TEXTO DOBLE ================= */
    /* Texto dentro de la imagen (doble capa) */
#previewTextoWrapper {
  position: absolute;
  inset: 40px 24px;
  overflow: hidden;
  border-radius: 24px;

  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

#previewTextoBack,
#previewTexto {
  position: absolute;
  padding: 20px;
  font-weight: bold;
  line-height: 1.25;
}

#previewTextoBack {
  z-index: 1;
  -webkit-text-stroke: 3px currentColor; /* 👈 más fino */
  opacity: 0.9;
  transform: translateY(-1px);
}

#previewTexto {
  z-index: 2;
}

@media (max-width: 480px) {
  #previewImagen {
    margin-bottom: 24px;
  }
}

.text-tools {
  display: flex;
  gap: 6px;
  justify-content: center;
}

.text-tools button {
  width: 44px;
  height: 36px;
  font-weight: bold;
}

.style-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 8px 0;
}

.style-row button {
  width: 34px;
  height: 34px;

  border-radius: 8px;
  border: none;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--ui-azul-claro);
  color: #000;

  font-weight: bold;
  cursor: pointer;
}

.style-row button.activo {
  background: var(--ui-azul-hover);
  color: #fff;
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.15);
}

.style-row input[type="color"] {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: none;
  padding: 0;
}

body.modo-imagen .versiculo.imagen {
border: 2px solid #ff4fa3;
}

/* Fuentes disponibles */
.font-roboto { font-family: 'Roboto', sans-serif; }
.font-lobster { font-family: 'Lobster', cursive; }
.font-playfair { font-family: 'Playfair Display', serif; }
.font-montserrat { font-family: 'Montserrat', sans-serif; }
.font-poppins { font-family: 'Poppins', sans-serif; }

/* ================= RESALTADOR COMPACTO (ARRIBA / COSTADO) ================= */
    
#btnResaltadorActivo {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: none;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  position: relative;
  overflow: hidden;
}

#resaltadorCompacto {
  position: relative;
  z-index: 9999;
}

/* 🔼 Se abre HACIA ARRIBA por defecto */
#paletaResaltadores {
  position: absolute;
  bottom: 110%;          /* 👈 CLAVE: arriba del botón */
  left: 0;

  display: none;
  background: #fff;
  border-radius: 12px;
  padding: 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,.25);

  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  min-width: 160px;
}

/* 👉 Si no entra arriba, se corre al costado */
#resaltadorCompacto.mover-derecha #paletaResaltadores {
  bottom: 0;
  left: 110%;
}

/* botones */
#paletaResaltadores button {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
}

  /* 🔥 FIX DEFINITIVO: evitar fondos fantasmas en imagen final */
#previewImagen.render-final #previewTextoWrapper {
  background: transparent !important;
}

/* 🔥 Cuando se genera la imagen, ocultar texto HTML real */
#previewImagen.render-final #previewTexto,
#previewImagen.render-final #previewTextoBack {
  display: none !important;
}

/* 🔥 Modal SIEMPRE legible (no gris) */
#modalPersonalizar {
  color: #000;
}

#modalPersonalizar label {
  color: #000;
}

#bannerModoImagen {
  display: none;
  text-align: center;
  font-size: 13px;
  padding: 6px;
  background: rgba(0,0,0,0.08);
}

body.oscuro #bannerModoImagen {
  background: rgba(255,255,255,0.08);
}

body.modo-imagen #texto {
  background: rgba(0,0,0,0.04);
}

body.oscuro.modo-imagen #texto {
  background: rgba(255,255,255,0.04);
}

/* 🖼️ Ocultar resaltador en modo imagen */
body.modo-imagen #resaltadorCompacto {
  display: none;
}

/* ================= CANDADO RESALTADOR ================= */
/* icono base (corazón / flor) */
#btnResaltadorActivo .icono-resaltador {
  display: inline-block;
  font-size: 18px;
  line-height: 1;
}

/* ================= MODAL BASE ================= */
#modalPersonalizar {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  overflow-y: auto;
}

/* CONTENEDOR INTERNO DEL MODAL */
#modalPersonalizar > div {
  position: relative;
  background: #fff;
  width: 100%;
  max-width: 420px;
  margin: auto;

  max-height: 92vh;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  overflow-y: hidden;
  padding-bottom: 16px;
}

/* TEXTO DE PREVIEW */
#previewTexto,
#previewTextoBack {
  white-space: pre-wrap;
  font-size: 22px;      /* 👈 tamaño “modico” base */
  line-height: 1.25;
  text-align: center;
  max-width: 100%;
}

/* INPUTS DE PERSONALIZACION */
#modalPersonalizar label {
  display: flex;
  flex-direction: column;
  font-size: 14px;
  color: #333;
}

#modalPersonalizar input,
#modalPersonalizar select {
  margin-top: 5px;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}

/* LISTA DE FONDOS 🟢 DEFINICIÓN DEFINITIVA (SE QUEDA) */
#personalizarFondos {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 5px;
}

#personalizarFondos img {
  height: 60px;
  width: 100px;
  object-fit: cover;
  border-radius: 6px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s ease;
}

#personalizarFondos img:hover,
#personalizarFondos img.selected {
  border-color: #007bff;
  transform: scale(1.05);
}
/*  🟢  */

/* SCROLLBAR PARA FONDOS */
#personalizarFondos::-webkit-scrollbar {
  height: 6px;
}

#personalizarFondos::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,0.3);
  border-radius: 3px;
}

#personalizarFondos::-webkit-scrollbar-track {
  background: rgba(0,0,0,0.1);
}

@media (max-width: 600px) {

#modalPersonalizar {
    padding: 10px;
  }
  }

/* ================= FUENTES VISUALES ================= */
/* CONTENEDOR FUENTES */
#listaFuentes {
  position: absolute;
  top: 110%;
  left: 50%;
  transform: translateX(-50%);

  display: none;
  grid-auto-flow: column;
  grid-template-rows: repeat(2, auto); /* 👈 2 filas */
  gap: 8px;

  max-width: 320px;
  overflow-x: auto;   /* 👈 solo costado */
  overflow-y: hidden;

  background: #fff;
  border-radius: 12px;
  padding: 10px;

  box-shadow: 0 8px 24px rgba(0,0,0,.25);
  z-index: 200;
}

#listaFuentes::-webkit-scrollbar {
  height: 6px;
}

#listaFuentes::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,.3);
  border-radius: 3px;
}

#btnFuentes {
  min-width: 78px;     /* 👈 entra “Fuentes” */
  height: 34px;
  padding: 0 10px;
  gap: 6px;

  border-radius: 8px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: var(--ui-azul-claro);
  color: #000;

  font-weight: bold;
  border: none;
  cursor: pointer;
}

#btnFuentes.activo {
  background: var(--ui-azul-hover);
  color: #fff;
}

.boton-fuentes {
  position: relative;
}

#btnFuentes {
  margin-bottom: 0;
}

#listaFuentes button {
  min-width: 120px;
  padding: 8px;
  font-size: 14px;
  white-space: nowrap;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  background: #f0f0f0;
}

#listaFuentes button.activo {
  background: var(--ui-azul-hover);
  color: #fff;
}

/* ✅ Mostrar lista de fuentes cuando está abierta */
#listaFuentes.abierto {
  display: grid;
}

.fila-opciones {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.fila-opciones label {
  font-size: 12px;
}

.fila-texto {
  display: flex;
  gap: 8px;
  justify-content: center;
  align-items: center;
}

.fila-final {
  display: flex;
  gap: 8px;
  justify-content: center;
  align-items: center;
  flex-wrap: nowrap; /* 👈 CLAVE */
  max-width: 420px;
  margin: 0 auto; /* esto reemplaza margin-left y margin-right */
}

.subir-iglesia-btn input {
  accent-color: #4f6fa8;
  transform: scale(0.9);
}

.cerrar-modal {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 99999; /* 👈 sube por encima de TODO */
  background: rgba(255,255,255,0.85);
  border-radius: 50%;
  width: 34px;
  height: 34px;
}

body.oscuro .cerrar-modal {
  color: #fff;
}

.opcion-color label {
  font-size: 12px;
}

.opacidad-slider {
  width: 92px;
  margin: 0;
}

/* box de tamaño */
.tamano-input {
  width: 60px;
  height: 34px;          /* iguala altura botones */
  text-align: center;
  padding: 0 4px;
  font-size: 14px;
}

/* flechas visibles */
.tamano-input::-webkit-inner-spin-button,
.tamano-input::-webkit-outer-spin-button {
  opacity: 1;
}


/* Alinear TODO en la fila */
.color-input {
  width: 66px;      /* 👈 más ancho */
  height: 34px;     /* 👈 mismo alto que estilos */
  border-radius: 8px;
  border: none;
  padding: 0;
  margin: 0 auto; /* 👈 centrado */
}


/* ================= ALINEAR CONTROLES CON PREVIEW ================= */

.fila-opciones,
.fila-texto {
  max-width: 420px;       /* mismo max-width que preview */
  margin-left: auto;
  margin-right: auto;
  justify-content: center;
}
    
/* ICONOS SECCIONES */
.nav-btn i {
  font-size: 16px;
  color: #4f6fa8;
}

/* 🌙 MODO OSCURO */
body.oscuro .nav-btn i {
  color: #ffd6a5;
}
    
.nav-btn:hover i {
  color: #3b5f9c;
}

body.oscuro .nav-btn:hover i {
  color: #ffbf69;
}

/* Iconos centrados en botones redondos */
.fila-final button i,
.subir-iglesia-btn i {
  font-size: 16px;
  line-height: 1;
  margin: 0;
}

.fila-final button,
.subir-iglesia-btn {
  width: 40px;
  height: 40px;

  border-radius: 999px;   /* 🔥 vuelven los redonditos */
  border: none;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  background: var(--ui-azul-claro);
  color: #000;

  box-shadow: 0 4px 10px rgba(0,0,0,.15);
  cursor: pointer;
}

body.oscuro .fila-final button,
body.oscuro .subir-iglesia-btn {
  background: #1f3a5f;   /* azul oscuro elegante */
  color: #fff;
}

.fila-final button:hover,
.subir-iglesia-btn:hover {
  background: var(--ui-azul-hover);
  color: #fff;
}

body.oscuro .fila-final button:hover,
body.oscuro .subir-iglesia-btn:hover {
  background: #ffbf69;
  color: #000;
}

/* ================= COLOR UNIFICADO UI ================= */

:root {
  --ui-azul-claro: #d1eeff;
  --ui-azul-hover: #4f6fa8;
}

.fila-opciones button {
  background: var(--ui-azul-claro);
  color: #000;
}

.fila-opciones button.activo {
  background: var(--ui-azul-hover);
  color: #fff;
}

.subir-iglesia-btn {
  cursor: pointer;
  position: relative; /* 👈 CLAVE para el ✓ */
}

.subir-iglesia-btn input {
  display: none;
}

.subir-iglesia-btn i {
  pointer-events: none;
}

/* CHECK ACTIVADO */
#checkIglesia:checked + i {
  color: #fff;
}

#checkIglesia:checked + i::after {
  content: "✓";
  position: absolute;
  bottom: -4px;
  right: -4px;
  background: #4f6fa8;
  color: #fff;
  font-size: 10px;
  border-radius: 50%;
  width: 14px;
  height: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}

@media (max-width: 480px) {
  #modalPersonalizar > div {
    width: 100%;
    margin: 0 auto;
    border-radius: 0;
  }
}

button.activo,
.style-row button.activo,
.fila-opciones button.activo {
  background: var(--ui-azul-hover) !important;
  color: #fff !important;
}


  </style>
 
</head>

<body>
<!-- ================= HEADER ================= -->
  <!-- Barra fija con navegación -->
<div id="header">

  <!-- Menú principal -->
<div id="menu">

  <button class="nav-btn" onclick="irA('biblia')">
    <i class="fa-solid fa-book-bible"></i>
    <span class="text">Biblia</span>
  </button>

  <button class="nav-btn" onclick="irA('devocionales')">
    <i class="fa-solid fa-calendar-days"></i>
    <span class="text">Devocionales</span>
  </button>

  <button class="nav-btn" onclick="irA('abc')">
    <i class="fa-solid fa-font"></i>
    <span class="text">ABC</span>
  </button>

  <button class="nav-btn" onclick="irA('iglesia')">
    <i class="fa-solid fa-church"></i>
    <span class="text">Iglesia</span>
  </button>

  <button class="nav-btn" onclick="irA('panel')">
    <i class="fa-solid fa-user"></i>
    <span class="text">Mi Panel</span>
  </button>

</div>

 <!-- Botón para alternar modo oscuro -->
    <button onclick="toggleTema()">🌙</button>
</div>

<!-- ================= SECCIÓN BIBLIA ================= -->
<div id="seccion-biblia" class="seccion">
<!-- Select de libro + capítulo -->
<div class="filtros">
  <select id="libro"></select>
  <select id="capitulo"></select>
<!-- Guardar marcador -->
  <button onclick="guardarMarcador()">📁</button>
<!-- Volver al marcador -->
  <button onclick="irAMarcador()">↩</button>
</div>
 <!-- ================= BANNER MODO IMAGEN ================= -->
 <!-- Solo se muestra cuando body tiene la clase modo-imagen -->
    <div id="bannerModoImagen">
  🖼️ Modo imagen activado · Tocá los versículos a incluir
</div>
<!-- Título del libro + capítulo -->
  <h3 id="titulo"></h3>
<!-- CONTENEDOR DEL TEXTO BÍBLICO -->
  <!-- ⚠️ JS inserta aquí los versículos -->
  <div id="texto"></div>
<!-- ================= CAJA DE NOTAS ================= -->
  <!-- ⚠️ Se muestra/oculta por JS --> 
  <div id="notaBox" style="display:none; margin-top:15px">
    <b>📝 Nota:</b>
    <!-- Texto de la nota -->
    <textarea id="notaTexto"></textarea>
    <!-- Guardar nota -->
    <button onclick="guardarNota()">💾 Guardar</button>
  </div>
 <!-- ================= BARRA DE ACCIONES ================= -->
  <div id="accionesBiblia" class="barra-acciones">
 <!-- Navegación de capítulos -->
    <button class="accion-normal" onclick="capituloAnterior()">‹</button>
    <button class="accion-normal" onclick="capituloSiguiente()">›</button>

    <!-- RESALTADOR COMPACTO (NUEVO) -->
<div id="resaltadorCompacto" style="position: relative;">
    
  <!-- Botón activo (corazón / color) -->
  <button id="btnResaltadorActivo" class="btn-resaltador">
    💛
  </button>

  <!-- Paleta desplegable -->
  <div id="paletaResaltadores">
    <button data-color="#ffd6e8">🌸</button> 
    <button data-color="#fff3b0">💛</button>
    <button data-color="#caffd1">💚</button>
    <button data-color="#ffc9c9">❤️</button>
    <button data-color="#ccecff">💙</button>
    <button data-color="#e6c9ff">💜</button>
    <button data-color="#ffe2c9">🧡</button>

    <!-- Botón Bloquear resaltador -->
    <button id="btnBloquearResaltador" title="Bloquear resaltador">🔒</button>
  </div>

</div>
 <!-- Tamaño de letra -->
    <button class="accion-normal" onclick="cambiarLetra(-1)">A−</button>
    <button class="accion-normal" onclick="cambiarLetra(1)">A+</button>
 <!-- Scroll arriba -->
    <button class="accion-normal"
            onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  <!-- Activar modo imagen -->
    <button id="btnImagen" onclick="toggleModoImagen()">🖼️</button>
 <!-- Crear imagen -->
    <!-- ⚠️ Por defecto está oculto por CSS -->
 <button id="btnCrearImagen"
        onclick="generarImagen()">
  Crear Imagen
</button>

</div>
</div>

<!-- ================= TOAST ================= -->
<!-- Notificación flotante -->
<div id="toast" class="toast" style="display: none;">
  📝 Nota guardada
</div>
  
<!-- ================= OTRAS SECCIONES ================= -->
<div id="seccion-devocionales" class="seccion" style="display:none">
  <h2>Devocionales</h2>
</div>

<div id="seccion-abc" class="seccion" style="display:none">
  <h2>ABC</h2>
</div>

<div id="seccion-iglesia" class="seccion" style="display:none">
  <h2>Iglesia</h2>
</div>

<!-- ================= PANEL ================= -->
<div id="seccion-panel" class="seccion" style="display:none">
  <h2>🗂️ Mi Panel</h2>
<!-- Tabs -->
  <div class="panel-tabs">
    <button onclick="mostrarSeccion('imagenes')">🖼️ Imágenes</button>
    <button onclick="mostrarSeccion('versiculos')">⭐ Versículos</button>
    <button onclick="mostrarSeccion('notas')">📝 Notas</button>
  </div>
  <!-- Imágenes -->
  <div id="panel-imagenes" class="panel-seccion">
    <p id="imagenes-vacio">Todavía no generaste imágenes.</p>
    <div id="grid-imagenes" class="grid-imagenes"></div>
  </div>
<!-- ⚠️ Estos paneles se rellenan por JS -->
  <div id="panel-versiculos" class="panel-seccion" style="display:none"></div>
  <div id="panel-notas" class="panel-seccion" style="display:none"></div>
</div>

<!-- ================= MODAL LOGIN ================= -->
<!-- Se muestra cuando el usuario no está logueado -->
<div id="loginModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:2000; justify-content:center; align-items:center;">
  <div style="background:white; padding:20px; border-radius:12px; max-width:320px; width:90%; text-align:center;">
    <h3>🔐 Iniciar sesión</h3>
    <p>Necesitás iniciar sesión para generar imágenes.</p>
    <button onclick="irALogin()">Iniciar sesión</button><br><br>
    <button onclick="cerrarLogin()">Cancelar</button>
  </div>
</div>

  <!-- CONTENEDOR INTERNO -->
  <div class="modal-contenido">

    <!-- CERRAR -->
    <button class="cerrar-modal" onclick="cancelarCrearImagen()">✖</button>

    <!-- PREVIEW -->
    <div id="previewImagen">
      <div id="previewTextoWrapper">
        <div id="previewTextoBack"></div>
        <div id="previewTexto"></div>
      </div>
    </div>

 <!-- FONDOS -->
    <div id="personalizarFondos"></div>
    
<!-- ================= FORMATO IMAGEN ================= -->
<div class="fila-opciones style-row">
 <button type="button" onclick="setFormatoImagen('post')" title="Post">
  <i class="fa-solid fa-square"></i>
</button>

<button type="button" onclick="setFormatoImagen('story')" title="Story">
  <i class="fa-solid fa-mobile-screen"></i>
</button>

 <input id="personalizarOpacidad" class="opacidad-slider"

<input id="personalizarTamaño" class="tamano-input"

<div style="position:relative;">

</div>

<button type="button" onclick="toggleBold()" id="btnBold">B</button>
<button type="button" onclick="toggleItalic()" id="btnItalic">I</button>
<button type="button" onclick="toggleUnderline()" id="btnUnderline">U</button>

</div>

<input id="personalizarColor" class="color-input" type="color" value="#000000">

</div>

 <button onclick="descargarImagenFinal()">
  <i class="fa-solid fa-download"></i>
</button>

<button onclick="compartirImagenFinal()">

</button>

  <button onclick="generarImagenFinal()">

</button>

<label class="subir-iglesia-btn">

  <i class="fa-solid fa-church"></i>
</label>

</div>

<div style="height:10px"></div>

</div>
