<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Vida Abundante</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
 
<!-- Fuentes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Lobster&family=Playfair+Display:wght@400;700&family=Montserrat:wght@400;700&family=Poppins:wght@400;700&family=Abril+Fatface&family=Cormorant:wght@400;700&family=Josefin+Sans:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- html2canvas (UNA SOLA VEZ) -->
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
  /* =====================================================
   ESTILOS GENERALES
   ===================================================== */

body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  line-height: 1.6;
  background: #fff;
  color: #000;
}

/* 🌙 Modo oscuro */
body.oscuro {
  background: #121212;
  color: #e0e0e0;
}

/* =====================================================
   HEADER / MENÚ
   ===================================================== */

#header {
  background: #fff;
  border-bottom: 1px solid #ddd;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

body.oscuro #header {
  background: #121212;
  border-color: #333;
}

#menu {
  display: flex;
  gap: 6px;
}

/* Botones de navegación */
.nav-btn {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  border-radius: 999px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  background: #eaeaea;
}

body.oscuro .nav-btn {
  background: #2a2a2a;
  color: #fff;
}

/* Ocultar texto en móvil */
@media (max-width: 640px) {
  .nav-btn .text {
    display: none;
  }
}

/* =====================================================
   SECCIONES
   ===================================================== */

.seccion {
  padding: 15px;
}

/* =====================================================
   BIBLIA
   ===================================================== */

.filtros {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}

.filtros select {
  padding: 10px;
  font-size: 16px;
}

#titulo {
  margin: 12px 0;
  font-weight: bold;
}

/* Versículos */
.versiculo {
  padding: 10px 14px;
  border-radius: 8px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: background .2s;
}

body.oscuro .versiculo {
  color: #fff;
}

/* Versículo marcado */
.versiculo[data-marcado="true"] {
  color: #000;
}

/* Versículo seleccionado para imagen */
.versiculo.imagen {
  background: #4f6fa8 !important;
  color: #fff !important;
}

/* =====================================================
   BARRA DE ACCIONES
   ===================================================== */

.barra-acciones {
  position: sticky;
  bottom: 0;
  z-index: 20;
  display: flex;
  gap: 6px;
  padding: 8px;
  background: #f5f5f5;
  border-top: 1px solid #ddd;
}

body.oscuro .barra-acciones {
  background: #1e1e1e;
  border-color: #333;
}

/* =====================================================
   MODO IMAGEN
   ===================================================== */

body.modo-imagen #accionesBiblia .accion-normal {
  display: none;
}

#btnCrearImagen {
  display: none;
}

body.modo-imagen #btnCrearImagen {
  display: inline-block;
}

/* Banner informativo */
#bannerModoImagen {
  display: none;
  text-align: center;
  font-size: 13px;
  padding: 6px;
  background: rgba(0,0,0,0.08);
}

body.modo-imagen #bannerModoImagen {
  display: block;
}

/* =====================================================
   MODAL PERSONALIZAR IMAGEN
   ===================================================== */

#modalPersonalizar {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  justify-content: center;
  align-items: center;
}

/* Caja interna del modal */
#modalPersonalizar > div {
  background: #fff;
  padding: 25px;
  max-width: 700px;
  width: 90%;
  border-radius: 12px;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Botón cerrar */
#modalPersonalizar .cerrar {
  position: absolute;
  top: 12px;
  right: 12px;
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
}

/* Botones finales del modal */
#modalPersonalizar .acciones {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
}

/* =====================================================
   PREVIEW DE IMAGEN
   ===================================================== */

#previewImagen {
  position: relative;
  width: 100%;
  height: 420px;
  border-radius: 16px;
  overflow: hidden;
  background: #eee;
  background-size: cover;
  background-position: center;
}

/* Contenedor del texto */
#previewTextoWrapper {
  position: absolute;
  inset: 40px 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* Texto frontal */
#previewTexto {
  position: relative;
  z-index: 2;
  font-weight: bold;
  line-height: 1.25;
}

/* Texto fondo (borde/sombra) */
#previewTextoBack {
  position: absolute;
  z-index: 1;
  filter: blur(0.4px);
}

/* =====================================================
   FONDOS
   ===================================================== */

#personalizarFondos {
  display: flex;
  gap: 8px;
  overflow-x: auto;
}

#personalizarFondos img {
  height: 60px;
  width: 100px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
}

#personalizarFondos img:hover {
  border-color: #4f6fa8;
}

    
  </style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div id="header">
  <div id="menu">
    <button class="nav-btn" onclick="irA('biblia')">📖 <span class="text">Biblia</span></button>
    <button class="nav-btn" onclick="irA('devocionales')">📆 <span class="text">Devocionales</span></button>
    <button class="nav-btn" onclick="irA('abc')">🔤 <span class="text">ABC</span></button>
    <button class="nav-btn" onclick="irA('iglesia')">⛪ <span class="text">Iglesia</span></button>
    <button class="nav-btn" onclick="irA('panel')">👤 <span class="text">Mi Panel</span></button>
  </div>

  <button onclick="toggleTema()">🌙</button>
</div>

<!-- ================= BIBLIA ================= -->
<div id="seccion-biblia" class="seccion">

<div class="filtros">
  <select id="libro"></select>
  <select id="capitulo"></select>

  <button onclick="guardarMarcador()">📁</button>
  <button onclick="irAMarcador()">↩</button>
</div>
  
    <div id="bannerModoImagen">
  🖼️ Modo imagen activado · Tocá los versículos a incluir
</div>

  <h3 id="titulo"></h3>
  <div id="texto"></div>
 
  <div id="notaBox" style="display:none; margin-top:15px">
    <b>📝 Nota:</b>
    <textarea id="notaTexto"></textarea>
    <button onclick="guardarNota()">💾 Guardar</button>
  </div>

  <div id="accionesBiblia" class="barra-acciones">

    <button class="accion-normal" onclick="capituloAnterior()">‹</button>
    <button class="accion-normal" onclick="capituloSiguiente()">›</button>

    <!-- RESALTADOR COMPACTO (NUEVO) -->
<div id="resaltadorCompacto" style="position: relative;">
    
  <!-- Botón activo (corazón / color) -->
  <button id="btnResaltadorActivo" class="btn-resaltador">
    💛
  </button>

  <!-- Paleta desplegable -->
  <div id="paletaResaltadores">
    <button data-color="#ffd6e8">🌸</button> 
    <button data-color="#fff3b0">💛</button>
    <button data-color="#caffd1">💚</button>
    <button data-color="#ffc9c9">❤️</button>
    <button data-color="#ccecff">💙</button>
    <button data-color="#e6c9ff">💜</button>
    <button data-color="#ffe2c9">🧡</button>

    <!-- Botón para bloquear -->
    <button id="btnBloquearResaltador" title="Bloquear resaltador">🔒</button>
  </div>

</div>

    <button class="accion-normal" onclick="cambiarLetra(-1)">A−</button>
    <button class="accion-normal" onclick="cambiarLetra(1)">A+</button>

    <button class="accion-normal"
            onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

    <button id="btnImagen" onclick="toggleModoImagen()">🖼️</button>

 <button id="btnCrearImagen"
        onclick="generarImagen()">
  Crear Imagen
</button>

  </div>
  
</div>

  <!-- Toast de Notificación -->
<div id="toast" class="toast" style="display: none;">
  📝 Nota guardada
</div>
  
<!-- ================= OTRAS SECCIONES ================= -->
<div id="seccion-devocionales" class="seccion" style="display:none">
  <h2>Devocionales</h2>
</div>

<div id="seccion-abc" class="seccion" style="display:none">
  <h2>ABC</h2>
</div>

<div id="seccion-iglesia" class="seccion" style="display:none">
  <h2>Iglesia</h2>
</div>

<!-- ================= PANEL ================= -->
<div id="seccion-panel" class="seccion" style="display:none">
  <h2>🗂️ Mi Panel</h2>

  <div class="panel-tabs">
    <button onclick="mostrarSeccion('imagenes')">🖼️ Imágenes</button>
    <button onclick="mostrarSeccion('versiculos')">⭐ Versículos</button>
    <button onclick="mostrarSeccion('notas')">📝 Notas</button>
  </div>

  <div id="panel-imagenes" class="panel-seccion">
    <p id="imagenes-vacio">Todavía no generaste imágenes.</p>
    <div id="grid-imagenes" class="grid-imagenes"></div>
  </div>

  <div id="panel-versiculos" class="panel-seccion" style="display:none"></div>
  <div id="panel-notas" class="panel-seccion" style="display:none"></div>
</div>

<!-- ================= MODAL LOGIN ================= -->
<div id="loginModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:2000; justify-content:center; align-items:center;">
  <div style="background:white; padding:20px; border-radius:12px; max-width:320px; width:90%; text-align:center;">
    <h3>🔐 Iniciar sesión</h3>
    <p>Necesitás iniciar sesión para generar imágenes.</p>
    <button onclick="irALogin()">Iniciar sesión</button><br><br>
    <button onclick="cerrarLogin()">Cancelar</button>
  </div>
</div>

<!-- ================= MODAL PERSONALIZAR IMAGEN ================= -->
<div id="modalPersonalizar">

  <div>
    <!-- Cerrar -->
    <button class="cerrar" onclick="cancelarCrearImagen()">✖</button>

    <!-- Preview -->
    <div id="previewImagen">
      <div id="previewTextoWrapper">
        <div id="previewTexto"></div>
        <div id="previewTextoBack"></div>
      </div>
    </div>

    <!-- Controles -->
    <div class="panel-opciones">
      <label>
        Tamaño
        <input id="personalizarTamaño" type="number" value="24">
      </label>

      <label>
        Color
        <input id="personalizarColor" type="color" value="#000000">
      </label>

      <label>
        Opacidad fondo
        <input id="personalizarOpacidad" type="range" min="0" max="1" step="0.05">
      </label>

      <label>
        Fuente
        <select id="personalizarFuente">
          <option>Roboto</option>
          <option>Playfair Display</option>
          <option>Lobster</option>
          <option>Montserrat</option>
          <option>Poppins</option>
          <option>Great Vibes</option>
        </select>
      </label>
    </div>

    <!-- Fondos -->
    <div id="personalizarFondos"></div>

    <!-- Acciones -->
    <div class="acciones">
      <button onclick="generarImagenFinal()">Generar imagen</button>
      <button onclick="descargarImagenFinal()">💾 Descargar</button>
      <button onclick="compartirImagenFinal()">📤 Compartir</button>
      <button onclick="subirImagen('personal')">⬆️ Subir a mi panel</button>
      <button onclick="subirImagen('iglesia')">⬆️ Subir a panel iglesia</button>
    </div>
  </div>

</div>


<!-- ================= CANVAS FINAL (OCULTO) ================= -->
<canvas id="canvasFinal" style="display:none;"></canvas>


<script type="module" src="js/estado.js"></script>
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/biblia.js"></script>
<script type="module" src="js/imagen.js"></script>
<script type="module" src="js/ui.js"></script>
<script type="module" src="js/main.js"></script> <!-- ✅ inicialización de app -->

  
</body>
</html>
