<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido de oración - Vida Abundante</title>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Arial, sans-serif;
      background:#eaf7ff;
      color:#111;
      text-align:center;
      padding:20px;
      box-sizing:border-box;
    }

    .box{
      max-width:420px;
      padding:22px;
      border-radius:20px;
      background:rgba(255,255,255,.85);
      border:1px solid rgba(0,0,0,.08);
      box-shadow:0 12px 30px rgba(0,0,0,.12);
    }

    .spinner{
      width:34px;
      height:34px;
      border-radius:50%;
      border:4px solid rgba(0,0,0,.12);
      border-top-color:#1c6fcb;
      margin:0 auto 14px;
      animation:girar .8s linear infinite;
    }

    @keyframes girar{
      to{ transform:rotate(360deg); }
    }

    h1{
      margin:0 0 8px;
      font-size:20px;
      line-height:1.2;
    }

    p{
      margin:0;
      font-size:14px;
      opacity:.78;
      line-height:1.35;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Abriendo pedido de oración...</h1>
    <p>Vida Abundante</p>
  </div>

  <script>
    (function(){
      const params = new URLSearchParams(window.location.search);

      const ref =
        params.get("ref") ||
        params.get("pedidoOracionRef") ||
        params.get("p") ||
        "";

      const path = window.location.pathname;
      const base = path.replace(/\/pedidosdeoracion\/?$/, "");

      const destino = ref
        ? `${window.location.origin}${base}/index.html?pedidoOracionRef=${encodeURIComponent(ref)}`
        : `${window.location.origin}${base}/index.html`;

      window.location.replace(destino);
    })();
  </script>
</body>
</html>
