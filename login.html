<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vida Abundante App - Ingresar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --ui-azul-claro: #e9f6ff;
      --ui-azul-hover: #a6d0ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(166,208,255,.55), transparent 34%),
        radial-gradient(circle at bottom right, rgba(233,246,255,.95), transparent 42%),
        linear-gradient(180deg, #ffffff, #eef8ff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      color: #111;
    }

    .login-page-card {
      position: relative;
      width: min(92vw, 410px);
      padding: 30px 24px 24px;
      border-radius: 30px;
      background:
        radial-gradient(circle at top left, rgba(166,208,255,.48), transparent 42%),
        radial-gradient(circle at bottom right, rgba(233,246,255,.9), transparent 48%),
        rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.9);
      box-shadow:
        0 22px 60px rgba(0,0,0,.18),
        inset 0 1px 0 rgba(255,255,255,.9);
      text-align: center;
      overflow: hidden;
    }

    .login-page-card::before {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      right: -75px;
      top: -75px;
      border-radius: 999px;
      background: rgba(166,208,255,.38);
    }

    .login-page-card::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      left: -60px;
      bottom: -60px;
      border-radius: 999px;
      background: rgba(233,246,255,.9);
    }

    .login-content {
      position: relative;
      z-index: 2;
    }

    .login-icon {
      width: 62px;
      height: 62px;
      margin: 0 auto 14px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, var(--ui-azul-claro), var(--ui-azul-hover));
      color: #111;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
    }

    .login-icon i {
      font-size: 26px;
      line-height: 1;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-weight: 900;
      line-height: 1.18;
      color: #111;
    }

    .login-info {
      margin: 13px auto 22px;
      max-width: 340px;
      font-size: 14px;
      line-height: 1.45;
      color: #263238;
    }

    .login-google-btn {
      width: 100%;
      min-height: 46px;
      border: none;
      border-radius: 999px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--ui-azul-hover);
      color: #000;
      font-weight: 900;
      font-size: 14px;
      box-shadow: 0 8px 18px rgba(0,0,0,.16);
      cursor: pointer;
    }

    .login-google-btn i {
      font-size: 16px;
    }

    .login-google-btn:hover {
      background: #8fc3fb;
      transform: translateY(-1px);
    }

    .login-sin-registro {
      margin-top: 12px;
      border: none;
      background: transparent;
      color: #263238;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      padding: 8px 10px;
      border-radius: 999px;
    }

    .login-sin-registro:hover {
      background: rgba(255,255,255,.7);
    }
  </style>
</head>

<body>
  <main class="login-page-card">
    <div class="login-content">

      <div class="login-icon">
        <i class="fa-solid fa-dove"></i>
      </div>

      <h1>Bendecido hermano, bienvenido a Vida Abundante App</h1>

      <p class="login-info">
        Puedes acceder sin registro, o puedes acceder ingresando tu cuenta de Google para personalizar y guardar tus preferencias.
      </p>

      <button type="button" class="login-google-btn" onclick="loginGoogle()">
        <i class="fa-brands fa-google"></i>
        <span>Ingresar con Google</span>
      </button>

  <button
  type="button"
  class="login-sin-registro"
  onclick="
    localStorage.setItem('VA_MODO_WEB_OK', '1');
    localStorage.setItem('VA_CONTINUAR_SIN_LOGIN', '1');
    window.location.href = '/VidaAbundante/';
  "
>
  Continuar sin iniciar sesión
</button>
      
    </div>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
